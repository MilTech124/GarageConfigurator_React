<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziękujemy - NewGarage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-200 min-h-screen flex items-center justify-center">
    <div class="max-w-2xl mx-auto p-8 bg-white rounded-lg shadow-lg text-center">
        <!-- Logo/Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-slate-800 mb-2">NewGarage</h1>
            <div class="w-24 h-1 bg-blue-500 mx-auto"></div>
        </div>

        <!-- Thank you message -->
        <div class="mb-8">
            <div class="text-6xl mb-4">✅</div>
            <h2 class="text-3xl font-bold text-slate-800 mb-4">Dziękujemy!</h2>
            <p class="text-lg text-slate-600 mb-6">
                Twój garaż został wysłany do wyceny. 
            </p>
            <p class="text-lg text-slate-600 mb-8">
                Postaramy się odezwać jak najwcześniej.
            </p>
        </div>

        <!-- Action buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="https://newgarage.pl/" 
               class="inline-block bg-slate-800 text-white px-8 py-3 rounded-lg font-semibold hover:bg-slate-700 transition-colors duration-200">
                Strona główna
            </a>
            <a href="/" 
               class="inline-block bg-blue-500 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-600 transition-colors duration-200">
                Nowa konfiguracja
            </a>
        </div>

        <!-- Additional info -->
        <div class="mt-12 pt-8 border-t border-slate-200">
            <p class="text-sm text-slate-500">
                Jeśli masz pytania, skontaktuj się z nami przez stronę główną.
            </p>
        </div>
    </div>

    <!-- Optional: Add some animation -->
    <script>
        // Simple fade-in animation
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.max-w-2xl');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.6s ease-out';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
